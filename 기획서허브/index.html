<nav class="toolbar" aria-label="문서 관리"><button class="primary" id="print">인쇄 / PDF 저장</button><label><input id="include-archive" type="checkbox"> 구버전 부록 포함</label><button id="edit">문서 목록 수정</button><button id="save">수정본 HTML 저장</button></nav>
<p class="screen-note">문서 제목을 누르면 공개 원문이 열립니다. 목록을 수정한 뒤에는 ‘수정본 HTML 저장’으로 변경 내용을 보관하세요.</p>
<main id="pages"></main>
<noscript><p class="noscript">이 HTML은 문서 목록을 표시하기 위해 JavaScript가 필요합니다. PDF 파일에서는 바로 확인할 수 있습니다.</p></noscript>
<dialog id="editor" aria-labelledby="editor-title"><h2 id="editor-title">문서 목록 수정</h2><p class="help">같은 문서의 새 버전은 기존 문서를 고른 뒤 ‘새 버전 추가’를 누르세요. 새 최신본을 저장하면 이전 최신본은 구버전으로 이동합니다.</p><label>편집할 문서<select id="record-choice"></select></label><div class="actions"><button id="new-record">새 문서 추가</button><button id="new-version">새 버전 추가</button></div>
<form id="record-form"><input type="hidden" name="id"><div class="edit-fields">
<label>문서명<input name="title" required maxlength="80"></label><label>프로젝트<input name="project" required maxlength="40"></label>
<label>분류<input name="category" required maxlength="40"></label><label>버전<input name="version" required maxlength="25"></label>

<label>날짜 기준<input name="dateBasis" required maxlength="40"></label><label>작성 시기<input name="period" required maxlength="80"></label>
<label>작성 기간<input name="duration" required maxlength="40"></label><label>버전 묶음<input name="group" required maxlength="120"></label>
<label class="wide">공개 문서 링크 (https)<input name="url" type="url" required></label><label class="wide">비고<textarea name="notes" rows="2" maxlength="220"></textarea></label>
</div><p class="help">‘버전 묶음’이 같으면 같은 문서의 버전으로 처리합니다. 날짜·기간을 모르면 ‘미확인’으로 남기세요. 새로 등록한 링크는 시크릿 창에서 공개 접근 여부를 확인해 주세요.</p><p id="edit-status" role="status"></p><div class="actions"><button type="submit" class="primary">목록에 반영</button><button type="button" id="close-editor">닫기</button></div></form></dialog>

<script>
'use strict';
let data=JSON.parse(document.getElementById('hub-data').textContent),dirty=false;
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function validLink(s){try{return new URL(s).protocol==='https:'}catch{return false}}
function sorted(status){return data.records.filter(r=>r.status===status).sort((a,b)=>(b.date||'').localeCompare(a.date||'')||a.project.localeCompare(b.project,'ko')||a.title.localeCompare(b.title,'ko')||b.version.localeCompare(a.version,undefined,{numeric:true}));}
function link(r,label){return validLink(r.url)?`<a href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">${esc(label)} ↗</a>`:`<span>${esc(label)} · 링크 확인 필요</span>`}
const version=r=>/^\d/.test(r.version)?'v'+r.version:r.version;
function record(r,archive=false){return `<article class="record" id="doc-${esc(r.id)}"><div class="record-top"><h3>${link(r,r.title)}</h3><span class="record-tag">${esc(r.project)} · ${esc(version(r))}</span></div><div class="record-meta"><div><span class="label">분류</span>${esc(r.category)}</div><div><span class="label">날짜</span>${esc(r.date||'미확인')} <span class="label">${esc(r.dateBasis)}</span></div><div><span class="label">작성 시기</span>${esc(r.period)}</div><div><span class="label">작성 기간</span>${esc(r.duration)}</div></div>${!archive&&r.notes?`<p class="record-note">${esc(r.notes)}</p>`:''}</article>`}
function page(title,sub,body,cls=''){return `<section class="sheet ${cls}"><header class="page-head"><div><p class="kicker">LEE DONGHYUN / PLANNING ARCHIVE</p><h2>${title}</h2></div><a href="#latest" class="edition">최신본 목차 ↑</a></header><p class="page-sub">${sub}</p><div class="records">${body}</div></section>`}
function render(){
 const latest=sorted('latest'),old=sorted('archive'),groups=new Set(latest.map(r=>r.group));
 if(groups.size!==latest.length)throw Error('한 문서 묶음에 최신본이 두 개 이상 있습니다.');
 const indexPages=Math.max(1,Math.ceil(latest.length/30));let html='';
 for(let n=0;n<indexPages;n++){
  const chunk=latest.slice(n*30,(n+1)*30),rows=Math.ceil(chunk.length/2);
  html+=`<section class="sheet" ${n===0?'id="latest"':''}><header class="page-head"><div><p class="kicker">PLANNING DOCUMENTS / ${esc(data.author)}</p><h1>기획서 허브${n?' · 목차 계속':''}</h1></div><div class="edition">갱신 ${esc(data.updated)}<br>최신 ${latest.length}개${data.includeArchive?' · 구버전 '+old.length+'개':''}</div></header><p class="intro"><strong>최신 기획서 바로 열기</strong><br>문서 제목은 공개 원문으로, ‘상세’는 작성 정보로 연결됩니다.</p><div class="section-line"><strong>최신본 ${n+1} / ${indexPages}</strong><span>날짜 내림차순 · 날짜 미확인 문서는 뒤에 배치</span></div><div class="index-grid" style="grid-template-rows:repeat(${rows},auto)">${chunk.map((r,i)=>`<div class="index-item"><span class="idx">${String(n*30+i+1).padStart(2,'0')}</span><div><span class="title">${link(r,r.title)}</span><div class="index-meta">${esc(r.project)} · ${esc(version(r))}<a href="#doc-${esc(r.id)}">상세 →</a> · ${esc(r.date||'날짜 미확인')}</div></div></div>`).join('')}</div><p class="bottom-note">작성 시기·기간·분류는 뒤의 상세 목록에서 확인할 수 있습니다.<br>‘기록상 N일’은 변경 이력 사이의 경과 기간이며 실제 투입 일수가 아닙니다.${data.includeArchive?'<br><a href="#archives">구버전 부록으로 이동 →</a>':''}</p></section>`;
 }
 for(let n=0;n<latest.length;n+=5)html+=page('최신본 · 작성 정보',`${n+1}-${Math.min(n+5,latest.length)} / ${latest.length} &nbsp; | &nbsp; 날짜 기준은 각 항목에 표기했습니다. Drive 수정일은 실제 작성일과 다를 수 있습니다.`,latest.slice(n,n+5).map(r=>record(r)).join(''));
 if(data.includeArchive)for(let n=0;n<old.length;n+=8)html+=page(`구버전 부록${n?'':' <span id="archives"></span>'}`,`${n+1}-${Math.min(n+8,old.length)} / ${old.length} &nbsp; | &nbsp; 비교·변경 이력 확인용입니다. 파일 기록은 실제 작성 시기·기간을 보장하지 않습니다.`,old.slice(n,n+8).map(r=>record(r,true)).join(''),'archive');
 $('pages').innerHTML=html;const sheets=document.querySelectorAll('.sheet');sheets.forEach((p,i)=>p.insertAdjacentHTML('beforeend',`<footer class="footer"><span>${esc(data.author)} · 기획서 허브</span><span>${i+1} / ${sheets.length}</span></footer>`));$('include-archive').checked=data.includeArchive;
}
function changed(){dirty=true;data.updated=new Date().toLocaleDateString('sv-SE');render()}
$('include-archive').onchange=e=>{data.includeArchive=e.target.checked;changed()};
$('print').onclick=async()=>{await document.fonts.ready;window.print()};
function fill(r){for(const el of $('record-form').elements)if(el.name)el.value=r[el.name]??'';$('edit-status').textContent=''}
function choices(id){$('record-choice').innerHTML=data.records.map(r=>`<option value="${esc(r.id)}">${esc(r.project+' / '+r.title+' / '+version(r)+' / '+(r.status==='latest'?'최신':'구버전'))}</option>`).join('');if(id)$('record-choice').value=id;fill(data.records.find(r=>r.id===$('record-choice').value)||{})}
$('edit').onclick=()=>{choices();$('editor').showModal()};$('record-choice').onchange=()=>fill(data.records.find(r=>r.id===$('record-choice').value));
$('new-record').onclick=()=>fill({status:'latest',dateBasis:'문서 일자 미확인',period:'미확인',duration:'미확인'});
$('new-version').onclick=()=>{const r=Object.fromEntries(new FormData($('record-form')));fill({...r,id:'',version:'',date:'',dateBasis:'문서 일자 미확인',period:'미확인',duration:'미확인',notes:'',url:'',status:'latest'})};
$('record-form').onsubmit=e=>{
 e.preventDefault();const r=Object.fromEntries(new FormData(e.target));for(const k in r)r[k]=r[k].trim();
 if(!validLink(r.url)){$('edit-status').textContent='https로 시작하는 공개 문서 주소를 입력해 주세요.';return}
 for(const k of ['title','project','category','version','group','dateBasis','period','duration'])if(!r[k]){$('edit-status').textContent='필수 항목을 입력해 주세요.';return}
 const original=data.records.find(x=>x.id===r.id);r.id=r.id||crypto.randomUUID();
 if(r.status==='latest')data.records.forEach(x=>{if(x.group===r.group&&x.id!==r.id)x.status='archive'});
 const entry={...original,...r,access:original?.url===r.url?original.access:'공개 접근 확인 필요',checked:original?.url===r.url?original.checked:''};
 if(original)data.records[data.records.indexOf(original)]=entry;else data.records.push(entry);
 changed();choices(r.id);$('edit-status').textContent='목록에 반영했습니다. 닫은 뒤 ‘수정본 HTML 저장’을 눌러 보관하세요.';
};
$('close-editor').onclick=()=>$('editor').close();
$('save').onclick=()=>{
 const copy=document.documentElement.cloneNode(true);copy.querySelector('#hub-data').textContent=JSON.stringify(data).replace(/</g,'\\u003c');copy.querySelector('#pages').innerHTML='';copy.querySelector('#editor').removeAttribute('open');copy.querySelector('#record-choice').innerHTML='';copy.querySelector('#edit-status').textContent='';
 const blob=new Blob(['<!doctype html>\n'+copy.outerHTML],{type:'text/html;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='이동현_기획서허브_'+data.updated+'.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),30000);dirty=false;
};
addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});render();
</script>
</body></html>
